<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <defs>
    <clipPath id="clipL"><circle cx="35" cy="78" r="46"/></clipPath>
    <clipPath id="clipR"><circle cx="85" cy="78" r="46"/></clipPath>
    <mask id="mNotR"><rect x="-20" y="0" width="200" height="160" fill="white"/><circle cx="85" cy="78" r="46" fill="black"/></mask>
    <mask id="mNotL"><rect x="-20" y="0" width="200" height="160" fill="white"/><circle cx="35" cy="78" r="46" fill="black"/></mask>
    <style>
      .cell { fill: #f8fafc; stroke: #e2e8f0; rx: 10; }
      .ring { fill: none; stroke: #94a3b8; stroke-width: 1.6; }
      .hi { fill: #3b82f6; fill-opacity: 0.5; stroke: #1d4ed8; stroke-width: 0.8; }
      .ttl { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .cap { font-size: 10.5px; fill: #64748b; }
      .note { font-size: 11px; fill: #475569; }
    </style>
  </defs>

  <rect width="1060" height="470" fill="#ffffff"/>
  <text x="20" y="28" style="font-size:16px;font-weight:700;fill:#0f172a">七种 JOIN：A 在左，B 在右</text>
  <text x="20" y="48" class="cap">蓝色 = 结果集包含哪些行。记住一句话：JOIN 的本质是"以哪个集合为准，去匹配另一个"</text>

  <!-- ═══ INNER ═══ -->
  <g transform="translate(20,66)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="85" cy="78" r="46" clip-path="url(#clipL)"/>
    <text x="14" y="24" class="ttl">INNER JOIN</text>
    <text x="14" y="162" class="note">只要两边都匹配上的行</text>
    <text x="14" y="148" class="cap">最常用，也是最容易丢数据的一种</text>
  </g>

  <!-- ═══ LEFT ═══ -->
  <g transform="translate(275,66)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="35" cy="78" r="46"/>
    <text x="14" y="24" class="ttl">LEFT JOIN</text>
    <text x="14" y="162" class="note">左表全部 + 右表匹配上的</text>
    <text x="14" y="148" class="cap">右表没匹配的行补 NULL</text>
  </g>

  <!-- ═══ LEFT ANTI ═══ -->
  <g transform="translate(530,66)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="35" cy="78" r="46" mask="url(#mNotR)"/>
    <text x="14" y="24" class="ttl">LEFT JOIN + IS NULL</text>
    <text x="14" y="162" class="note">只在左表、右表没有的行</text>
    <text x="14" y="148" class="cap">"找出从没下过单的客户"</text>
  </g>

  <!-- ═══ CROSS ═══ -->
  <g transform="translate(785,66)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <g fill="#3b82f6" fill-opacity="0.5">
      <rect x="30" y="46" width="14" height="14" rx="2"/><rect x="52" y="46" width="14" height="14" rx="2"/><rect x="74" y="46" width="14" height="14" rx="2"/>
      <rect x="30" y="68" width="14" height="14" rx="2"/><rect x="52" y="68" width="14" height="14" rx="2"/><rect x="74" y="68" width="14" height="14" rx="2"/>
      <rect x="30" y="90" width="14" height="14" rx="2"/><rect x="52" y="90" width="14" height="14" rx="2"/><rect x="74" y="90" width="14" height="14" rx="2"/>
    </g>
    <text x="110" y="58" class="cap" style="font-weight:700">A × B</text>
    <text x="110" y="74" class="cap">3 行 × 3 行</text>
    <text x="110" y="90" class="cap">= 9 行</text>
    <text x="14" y="24" class="ttl">CROSS JOIN</text>
    <text x="14" y="162" class="note">笛卡尔积：每行配每行</text>
    <text x="14" y="148" class="cap">生成组合/日期补齐时才有用</text>
  </g>

  <!-- ═══ RIGHT ═══ -->
  <g transform="translate(20,266)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="85" cy="78" r="46"/>
    <text x="14" y="24" class="ttl">RIGHT JOIN</text>
    <text x="14" y="162" class="note">右表全部 + 左表匹配上的</text>
    <text x="14" y="148" class="cap">SQLite 不支持；调换表序改写成 LEFT</text>
  </g>

  <!-- ═══ FULL ═══ -->
  <g transform="translate(275,266)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="35" cy="78" r="46"/>
    <circle class="hi" cx="85" cy="78" r="46"/>
    <text x="14" y="24" class="ttl">FULL OUTER JOIN</text>
    <text x="14" y="162" class="note">两边全都要，匹配不上补 NULL</text>
    <text x="14" y="148" class="cap">SQLite/MySQL 都不支持，可用两个 LEFT UNION 模拟</text>
  </g>

  <!-- ═══ FULL ANTI ═══ -->
  <g transform="translate(530,266)">
    <rect class="cell" x="0" y="0" width="240" height="180" rx="10"/>
    <circle class="ring" cx="35" cy="78" r="46"/>
    <circle class="ring" cx="85" cy="78" r="46"/>
    <circle class="hi" cx="35" cy="78" r="46" mask="url(#mNotR)"/>
    <circle class="hi" cx="85" cy="78" r="46" mask="url(#mNotL)"/>
    <text x="14" y="24" class="ttl">FULL + 两边 IS NULL</text>
    <text x="14" y="162" class="note">两边各自独有的行</text>
    <text x="14" y="148" class="cap">对账常用：找出两边对不上的记录</text>
  </g>

  <!-- ═══ 提示卡 ═══ -->
  <g transform="translate(785,266)">
    <rect x="0" y="0" width="240" height="180" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="14" y="24" class="ttl" fill="#1e40af">⚠ 最常见的三个坑</text>
    <text x="14" y="48" class="note" fill="#1e40af">1. LEFT JOIN 后在 WHERE 里</text>
    <text x="14" y="64" class="note" fill="#1e40af">　 过滤右表 → 退化成 INNER</text>
    <text x="14" y="88" class="note" fill="#1e40af">2. 一对多 JOIN 后 SUM 翻倍</text>
    <text x="14" y="104" class="note" fill="#1e40af">　 （订单表 JOIN 明细表）</text>
    <text x="14" y="128" class="note" fill="#1e40af">3. NOT IN 的子查询含 NULL</text>
    <text x="14" y="144" class="note" fill="#1e40af">　 → 结果直接变成空</text>
  </g>
</svg>
