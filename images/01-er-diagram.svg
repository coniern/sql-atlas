<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .k { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.7; }
      .j { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.7; }
      .bad { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 5 3; }
      .h { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .c { font-size: 10.5px; fill: #475569; }
      .p { font-size: 10.5px; fill: #1d4ed8; font-weight: 600; }
      .f { font-size: 10.5px; fill: #b45309; font-weight: 600; }
      .r { stroke: #64748b; stroke-width: 1.3; fill: none; }
      .l { font-size: 10px; fill: #64748b; font-weight: 700; }
      .ti { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .su { font-size: 11.5px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="30" y="32" class="ti">atlas.db 的表结构（9 张表）</text>
  <text x="30" y="52" class="su">蓝底 = 主键在首列 · 黄底 = 连接表 · 红虚线 = 反面教材 · 箭头方向 = 多的一方</text>

  <!-- ═══ 列 1：来源 ═══ -->
  <g>
    <rect class="t k" x="28" y="86" width="200" height="118" rx="7"/>
    <text x="40" y="106" class="h">customers · 客户</text>
    <text x="40" y="124" class="p">PK customer_id</text>
    <text x="40" y="140" class="c">name / phone / city</text>
    <text x="40" y="156" class="c">tier / credit_limit</text>
    <text x="40" y="174" class="c">300 行 · 48 行无订单</text>
    <text x="40" y="192" class="c">（LEFT JOIN 素材）</text>
  </g>
  <g>
    <rect class="t k" x="28" y="292" width="200" height="118" rx="7"/>
    <text x="40" y="312" class="h">employees · 员工</text>
    <text x="40" y="330" class="p">PK employee_id</text>
    <text x="40" y="346" class="f">FK manager_id → 自身</text>
    <text x="40" y="362" class="c">name / title / dept</text>
    <text x="40" y="380" class="c">26 人 · 4 层汇报链</text>
    <text x="40" y="398" class="c">递归 CTE 练习场</text>
  </g>

  <!-- ═══ 列 2：核心 ═══ -->
  <g>
    <rect class="t" x="308" y="86" width="200" height="132" rx="7" stroke="#94a3b8" stroke-width="2.4"/>
    <text x="320" y="106" class="h">orders · 订单 ★</text>
    <text x="320" y="124" class="p">PK order_id</text>
    <text x="320" y="140" class="f">FK customer_id</text>
    <text x="320" y="156" class="f">FK employee_id</text>
    <text x="320" y="172" class="c">status / ordered_at</text>
    <text x="320" y="188" class="c">shipped_at / note</text>
    <text x="320" y="206" class="c">3000 行 · 5 种状态</text>
  </g>
  <g>
    <rect class="t" x="308" y="468" width="200" height="106" rx="7"/>
    <text x="320" y="488" class="h">audit_log · 审计</text>
    <text x="320" y="506" class="p">PK log_id</text>
    <text x="320" y="522" class="c">table_name / action</text>
    <text x="320" y="538" class="c">old_value / new_value</text>
    <text x="320" y="556" class="c">触发器自动写入</text>
  </g>

  <!-- ═══ 列 3：结果 ═══ -->
  <g>
    <rect class="t j" x="588" y="86" width="200" height="118" rx="7"/>
    <text x="600" y="106" class="h">order_items · 明细</text>
    <text x="600" y="124" class="p">PK item_id</text>
    <text x="600" y="140" class="f">FK order_id</text>
    <text x="600" y="156" class="f">FK product_id</text>
    <text x="600" y="174" class="c">quantity / unit_price</text>
    <text x="600" y="190" class="c">discount (0~1) · 6048 行</text>
  </g>
  <g>
    <rect class="t" x="588" y="292" width="200" height="112" rx="7"/>
    <text x="600" y="312" class="h">payments · 支付</text>
    <text x="600" y="330" class="p">PK payment_id</text>
    <text x="600" y="346" class="f">FK order_id</text>
    <text x="600" y="362" class="c">amount / method / paid_at</text>
    <text x="600" y="380" class="c">is_refund（退款为负）</text>
    <text x="600" y="396" class="c">2639 行</text>
  </g>
  <g>
    <rect class="t bad" x="588" y="468" width="200" height="106" rx="7"/>
    <text x="600" y="488" class="h" fill="#b91c1c">users · 用户（反面教材）</text>
    <text x="600" y="506" class="p">PK user_id</text>
    <text x="600" y="522" class="c" fill="#b91c1c">password 明文存储 ⚠</text>
    <text x="600" y="538" class="c">username / role / api_key</text>
    <text x="600" y="556" class="c">第 11 章的注入靶子</text>
  </g>

  <!-- ═══ 列 4：目录 ═══ -->
  <g>
    <rect class="t" x="868" y="86" width="200" height="112" rx="7"/>
    <text x="880" y="106" class="h">products · 产品</text>
    <text x="880" y="124" class="p">PK product_id</text>
    <text x="880" y="140" class="f">FK category_id</text>
    <text x="880" y="156" class="c">sku / name / price / cost</text>
    <text x="880" y="174" class="c">stock / is_active</text>
    <text x="880" y="190" class="c">150 行 · 12 行从未卖出</text>
  </g>
  <g>
    <rect class="t k" x="868" y="292" width="200" height="118" rx="7"/>
    <text x="880" y="312" class="h">categories · 品类</text>
    <text x="880" y="330" class="p">PK category_id</text>
    <text x="880" y="346" class="f">FK parent_id → 自身</text>
    <text x="880" y="362" class="c">name / sort_order</text>
    <text x="880" y="380" class="c">5 大类 → 15 子类</text>
    <text x="880" y="398" class="c">三层树 · 递归 CTE</text>
  </g>

  <!-- ═══ 关系线（全部走水平/垂直，避免交叉）═══ -->
  <!-- customers → orders -->
  <path class="r" d="M 228 145 L 308 145" marker-end="url(#ar)"/>
  <text x="258" y="136" class="l">1</text>
  <text x="290" y="136" class="l">N</text>

  <!-- employees → orders（折线） -->
  <path class="r" d="M 228 351 L 268 351 L 268 200 L 308 200" marker-end="url(#ar)"/>
  <text x="240" y="342" class="l">1</text>
  <text x="288" y="192" class="l">N</text>

  <!-- orders → order_items -->
  <path class="r" d="M 508 130 L 588 130" marker-end="url(#ar)"/>
  <text x="536" y="121" class="l">1</text>
  <text x="570" y="121" class="l">N</text>

  <!-- orders → payments（折线） -->
  <path class="r" d="M 508 200 L 548 200 L 548 348 L 588 348" marker-end="url(#ar)"/>
  <text x="518" y="192" class="l">1</text>
  <text x="556" y="340" class="l">N</text>

  <!-- order_items → products -->
  <path class="r" d="M 788 145 L 868 145" marker-end="url(#ar)"/>
  <text x="816" y="136" class="l">N</text>
  <text x="846" y="136" class="l">1</text>

  <!-- categories → products（垂直向上） -->
  <path class="r" d="M 968 292 L 968 198" marker-end="url(#ar)"/>
  <text x="976" y="272" class="l">N</text>
  <text x="976" y="216" class="l">1</text>

  <!-- employees 自引用（左侧外圈） -->
  <path class="r" d="M 28 360 C 6 360 6 322 28 322" marker-end="url(#ar)" stroke-dasharray="4 3"/>
  <!-- categories 自引用（右侧外圈） -->
  <path class="r" d="M 1068 330 C 1092 330 1092 372 1068 372" marker-end="url(#ar)" stroke-dasharray="4 3"/>

  <!-- ═══ 底部说明 ═══ -->
  <line x1="30" y1="608" x2="1070" y2="608" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="632" class="l" style="font-size:11px">读图要点</text>
  <text x="30" y="654" class="c">· 订单 : 明细 = 1 : 1~5，一对多 JOIN 后行数膨胀 2 倍（第 4 章实测）；order_items 是 orders 与 products 多对多的连接表</text>
  <text x="30" y="674" class="c">· categories、employees 都是自引用树，普通 JOIN 只能查一层，查整棵树必须用递归 CTE（第 7 章）</text>
  <text x="30" y="694" class="c">· 明细里的 unit_price 是下单时的价格快照——价格会变，历史账单不能跟着变（"必要的冗余"，第 10 章）</text>
</svg>
